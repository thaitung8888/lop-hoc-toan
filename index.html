<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp học Toán</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="viewLogin" class="login">
  <div class="art"><div class="blob b1"></div><div class="blob b2"></div>
    <div class="logo"><i>🧮</i>Lớp học Toán</div>
    <h1>Học Toán lớp 1 đến lớp 5, chấm điểm trong tích tắc.</h1>
    <p>Giáo viên tạo đề, học sinh làm bài và nhận kết quả ngay. Mọi tài liệu học tập đều ở cùng một nơi.</p>
  </div>
  <div class="fwrap"><form class="box" id="lf" autocomplete="off">
    <h2>Đăng nhập</h2><p class="sub">Dùng tài khoản do nhà trường cấp.</p>
    <label for="u">Tên đăng nhập</label><input class="inp" id="u" required>
    <label for="p">Mật khẩu</label><input class="inp" id="p" type="password" required>
    <div class="err" id="err" role="alert"></div>
    <button class="btn grad full">Đăng nhập</button>
  </form></div>
</section>
<div id="viewApp" class="hidden">
  <header><div class="logo"><i>🧮</i>Lớp học Toán</div><nav id="nav"></nav>
    <div class="av grad" id="av"></div><div class="who"><b id="wn"></b><small id="wr"></small></div><button class="out" id="logout">Đăng xuất</button></header>
  <main id="pg"></main>
</div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
